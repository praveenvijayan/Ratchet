name: release-pr-gates

# Runs the one check pr-gates doesn't carry: version-consistency for the
# release version-bump PR opened by scripts/release.mjs. `pr-gates` now runs
# its GATES.md suite and size check on every PR (issue #479), but that suite
# has no notion of "do the four version strings agree" — a partial or
# malformed bump (some version locations updated, others not) would still
# land unverified; PR #384 (v5.0.0) shipped with no checks at all.
#
# This workflow closes that gap without folding release-specific logic into
# pr-gates: it runs the shared version-consistency check on `release/*` PRs
# only, and fails the moment the known version locations disagree — so a
# drifted bump is caught before merge. It never fires on other PRs, which is
# fine — they carry no version bump for it to check.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  version-consistency:
    # Only the release version-bump PR carries the multi-file bump this checks;
    # every other head (agent/issue-*, plan, etc.) is skipped.
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Runs against the PR's own checked-out tree — exactly the version files
      # the bump edited. Exits non-zero and names each disagreeing location if
      # any known version string has drifted.
      - name: Check version consistency
        run: node scripts/version-consistency.mjs
